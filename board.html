<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>푸른코끼리 | 응원 전광판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy-deep:#0B1533;
  --navy-mid:#132251;
  --blue:#4F7CFF;
  --blue-soft:#8FB0FF;
  --blue-pale:#C9D6FF;
  --coral:#FF9166;
  --gold:#FFC24B;
  --cream:#FDF6EC;
  --cream-dim:rgba(253,246,236,.62);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--navy-deep);font-family:'Noto Sans KR',sans-serif;color:var(--cream)}
.stage{
  position:relative;width:100%;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:
    radial-gradient(ellipse 140% 60% at 50% 6%, rgba(79,124,255,.22), transparent 60%),
    radial-gradient(ellipse 110% 55% at 50% 100%, rgba(79,124,255,.18), transparent 65%),
    linear-gradient(180deg, var(--navy-deep) 0%, var(--navy-mid) 55%, var(--navy-deep) 100%);
}

/* ═══ L0 별가루 ═══ */
.dust{position:absolute;inset:0;z-index:0;pointer-events:none}
.dust span{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--blue-pale);opacity:.3;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.55}}

/* ═══ L1 코끼리 (배경) ═══ */
.elephant{
  position:absolute;z-index:1;left:33%;bottom:0;transform:translateX(-50%);
  width:min(42vh,460px);pointer-events:none;opacity:.26;
  filter:drop-shadow(0 0 40px rgba(79,124,255,.55));
  animation:sway 6s ease-in-out infinite;
}
.elephant img{display:block;width:100%;height:auto}
@keyframes sway{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-12px)}}

/* ═══ L2 스크림 ═══ */
.scrim{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 42% at 33% 92%, rgba(11,21,51,.6), transparent 70%),
    linear-gradient(180deg, rgba(11,21,51,.4) 0%, rgba(11,21,51,0) 20%, rgba(11,21,51,0) 60%, rgba(11,21,51,.75) 100%);
}

/* ═══ L9 상단 ═══ */
.topbar{
  position:relative;z-index:9;flex:0 0 auto;display:flex;align-items:flex-end;gap:16px;
  padding:16px 26px 14px;background:linear-gradient(180deg, rgba(11,21,51,.9), rgba(11,21,51,0));
}
.brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--blue-pale);opacity:.75;text-transform:uppercase;margin-bottom:5px}
.brand .eyebrow b{color:var(--coral);font-weight:500}
.brand h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(20px,2.2vw,32px);line-height:1.1;letter-spacing:-.01em;text-shadow:0 0 22px rgba(79,124,255,.4)}
.brand h1 em{font-style:normal;color:var(--coral)}
.meters{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0}
.chip{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;
  color:var(--blue-pale);background:rgba(79,124,255,.12);border:1px solid rgba(143,176,255,.25);
  padding:6px 14px;border-radius:999px;white-space:nowrap
}
.chip b{color:var(--cream);font-weight:500;font-variant-numeric:tabular-nums}
.chip.room{background:rgba(255,145,102,.14);border-color:rgba(255,145,102,.4);color:var(--coral)}
.chip.room b{color:var(--cream)}
.led{width:7px;height:7px;border-radius:50%;background:var(--coral);animation:pulse 1.6s ease-in-out infinite}
.led.off{background:#E5484D;animation:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

/* ═══ 본문: 메시지 + 캐릭터 ═══ */
.main{position:relative;z-index:5;flex:1 1 auto;display:flex;min-height:0}
.field{position:relative;flex:1 1 auto;overflow:hidden;min-width:0}

.msg{
  position:absolute;top:100%;left:var(--x);width:var(--w);
  padding:18px 24px;border-radius:24px;
  background:rgba(11,21,51,.58);border:1px solid rgba(143,176,255,.28);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  box-shadow:0 12px 40px rgba(5,10,28,.5), inset 0 1px 0 rgba(201,214,255,.14);
  will-change:transform;animation:rise var(--dur) linear forwards;
}
.msg .t{
  font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:var(--fs);
  line-height:1.34;letter-spacing:-.015em;color:var(--cream);
  word-break:keep-all;overflow-wrap:anywhere;
  text-shadow:0 0 26px rgba(79,124,255,.55), 0 3px 12px rgba(0,0,0,.7);
}
.msg .n{margin-top:12px;font-family:var(--mono);font-size:18px;color:var(--coral);opacity:.95}
.msg.fresh{border-color:rgba(255,145,102,.55);box-shadow:0 12px 44px rgba(255,145,102,.22),0 12px 40px rgba(5,10,28,.5)}
@keyframes rise{
  0%{transform:translateY(0) scale(.96);opacity:0}
  8%{opacity:1}
  86%{opacity:1}
  100%{transform:translateY(calc(-100dvh - 150%)) scale(1);opacity:0}
}

.waiting{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:0 24px}
.waiting strong{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(22px,3vw,38px);text-shadow:0 0 24px rgba(79,124,255,.45)}
.waiting span{font-family:var(--mono);font-size:12.5px;color:var(--cream-dim)}

/* ═══ 캐릭터 패널 ═══ */
.mascot{
  flex:0 0 auto;width:clamp(230px,22vw,320px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:10px 18px 18px;
  border-left:1px solid rgba(143,176,255,.18);
  background:linear-gradient(180deg, rgba(19,34,81,.28), rgba(11,21,51,.62));
}
.mascot-art{position:relative;width:100%;aspect-ratio:320/400;max-height:40vh}
.mascot-art img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  opacity:0;transition:opacity .9s ease, transform .9s ease;transform:scale(.96);
  filter:drop-shadow(0 10px 26px rgba(5,10,28,.55))
}
.mascot-art img.on{opacity:1;transform:scale(1)}
.mascot-label{
  text-align:center;font-family:'Black Han Sans',sans-serif;font-weight:400;
  font-size:clamp(16px,1.4vw,22px);line-height:1.35;color:var(--cream);
  text-shadow:0 0 20px rgba(255,145,102,.35)
}
.mascot-sub{margin-top:5px;font-family:var(--mono);font-size:11.5px;color:var(--cream-dim);letter-spacing:.06em}

/* QR — PC 전광판에서만 노출 */
.qr{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:2px}
.qr-frame{
  background:var(--cream);border-radius:14px;padding:10px;
  box-shadow:0 10px 30px rgba(5,10,28,.5), 0 0 0 1px rgba(143,176,255,.3);
  line-height:0
}
.qr-frame img{display:block;width:clamp(112px,9vw,150px);height:auto;border-radius:4px}
.qr-cap{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--coral);
  text-align:center;text-shadow:0 0 16px rgba(255,145,102,.35)
}

/* ═══ 하단 목표 달성률 ═══ */
.goal{
  position:relative;z-index:9;flex:0 0 auto;
  padding:14px 26px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, rgba(11,21,51,.94), rgba(11,21,51,0));
}
.goal-head{display:flex;align-items:baseline;gap:12px;margin-bottom:9px}
.goal-head .label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--blue-pale);opacity:.8;text-transform:uppercase}
.goal-head .pct{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(22px,2.4vw,34px);color:var(--coral);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(255,145,102,.45)}
.goal-head .nums{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--cream-dim);font-variant-numeric:tabular-nums}
.goal-head .nums b{color:var(--cream);font-weight:500}
.track{position:relative;height:14px;border-radius:999px;background:rgba(79,124,255,.14);border:1px solid rgba(143,176,255,.22);overflow:hidden}
.fill{position:relative;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--blue) 0%,var(--blue-soft) 55%,var(--coral) 100%);box-shadow:0 0 20px rgba(79,124,255,.6);transition:width 1.1s cubic-bezier(.25,.9,.3,1)}
.fill::after{content:"";position:absolute;top:0;right:0;width:70px;height:100%;background:linear-gradient(90deg,transparent,rgba(253,246,236,.28))}
.track.done .fill{background:linear-gradient(90deg,var(--coral),var(--gold))}

/* ═══ 모바일 뷰 ═══ */
body.mobile .topbar{padding:14px 18px 10px;flex-direction:column;align-items:flex-start;gap:9px}
body.mobile .meters{margin-left:0;width:100%;flex-wrap:wrap;gap:8px}
body.mobile .chip{font-size:11px;padding:5px 11px}
body.mobile .brand h1{font-size:clamp(19px,5.6vw,26px)}
body.mobile .elephant{left:50%;bottom:180px;width:min(66vw,300px);opacity:.16}
body.mobile .main{flex-direction:column}
body.mobile .msg{padding:14px 18px;border-radius:20px}
body.mobile .msg .n{font-size:16.5px;margin-top:9px}
body.mobile .mascot{
  width:100%;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;
  border-left:0;border-top:1px solid rgba(143,176,255,.18);
  padding:10px 18px;height:158px
}
body.mobile .mascot-art{width:120px;height:138px;aspect-ratio:auto;max-height:none;flex:0 0 auto}
body.mobile .mascot-label{text-align:left;font-size:19px}
body.mobile .qr{display:none}
body.mobile .goal{padding:12px 18px calc(16px + env(safe-area-inset-bottom))}
body.mobile .goal-head .pct{font-size:26px}
body.mobile .track{height:12px}

@media (prefers-reduced-motion:reduce){
  .elephant,.led,.dust span{animation:none}
  .msg{animation:none;top:auto;bottom:12%;left:50%!important;width:min(88%,720px)!important;transform:translateX(-50%)}
}
</style>
</head>
<body>
<div class="stage">

  <div class="dust" id="dust"></div>
  <div class="elephant"><img src="1000018839.png" alt="아이를 감싸안은 푸른코끼리 가족"></div>
  <div class="scrim"></div>

  <div class="topbar">
    <div class="brand">
      <div class="eyebrow">삼성 CSR · <b>푸른코끼리</b> 사이버 폭력 예방 캠페인</div>
      <h1>너는 <em>혼자</em>가 아니야</h1>
    </div>
    <div class="meters">
      <span class="chip room">ROOM <b id="roomNo">1</b></span>
      <span class="chip"><i class="led" id="led"></i><span id="ledText">연결 중</span></span>
      <span class="chip">응원 <b id="count">0</b></span>
    </div>
  </div>

  <div class="main">
    <div class="field" id="field">
      <div class="waiting" id="waiting">
        <strong>첫 응원을 기다리고 있어요</strong>
        <span>QR을 찍고 메시지를 남기면 이곳에 떠오릅니다</span>
      </div>
    </div>

    <aside class="mascot">
      <div class="mascot-art">
        <img id="mSad"   src="student_sad.svg"   class="on" alt="울상인 학생">
        <img id="mSoso"  src="student_soso.svg"  alt="조금씩 밝아지는 학생">
        <img id="mHappy" src="student_happy.svg" alt="환하게 웃는 학생">
      </div>
      <div>
        <div class="mascot-label" id="mascotLabel">아직 마음이 무거워요</div>
        <div class="mascot-sub" id="mascotSub">응원이 모이면 표정이 바뀝니다</div>
      </div>

      <div class="qr">
        <div class="qr-frame">
          <img src="url_qrcodecreator.com_15_44_28.png" alt="응원 메시지 남기기 QR 코드">
        </div>
        <div class="qr-cap">QR을 찍고 응원 남기기</div>
      </div>
    </aside>
  </div>

  <div class="goal">
    <div class="goal-head">
      <span class="label">목표 달성률</span>
      <span class="pct" id="pct">0%</span>
      <span class="nums"><b id="cur">0</b> / <span id="goalNum">10</span>개</span>
    </div>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   푸른코끼리 응원 전광판

   주소 뒤 파라미터
     ?room=2      전광판 번호. 숫자만 사용하며 기본값은 1입니다.
                  번호를 바꾸면 데이터가 완전히 분리된 새 전광판이 열립니다.
     ?goal=50     목표 메시지 수. 미입력 시 10입니다.
   예) board.html?room=2&goal=50
   ═══════════════════════════════════════════════════════════ */
const CONFIG = {
  DB_URL      : "https://jmtcsr1-default-rtdb.asia-southeast1.firebasedatabase.app",
  DEFAULT_ROOM: "1",
  DEFAULT_GOAL: 10,
  POLL_MS     : 900,
  POOL        : 60
};

const q = new URLSearchParams(location.search);

/* 룸 번호는 숫자만 허용합니다 */
const rawRoom = (q.get("room") || "").replace(/[^0-9]/g, "");
const ROOM = rawRoom !== "" ? String(parseInt(rawRoom, 10)) : CONFIG.DEFAULT_ROOM;

const rawGoal = parseInt(q.get("goal"), 10);
const GOAL = Number.isFinite(rawGoal) && rawGoal > 0 ? rawGoal : CONFIG.DEFAULT_GOAL;

const ROOT      = `${CONFIG.DB_URL}/rooms/${ROOM}`;
const MSGS      = `${ROOT}/msgs.json`;
const CTRL      = `${ROOT}/ctrl.json`;

const el = id => document.getElementById(id);
const nf = n => n.toLocaleString("ko-KR");
el("roomNo").textContent = ROOM;
el("goalNum").textContent = nf(GOAL);
document.title = `푸른코끼리 전광판 · ROOM ${ROOM}`;

/* ── 모바일 / PC 판별 ── */
let isMobile = false;
function detectView(){
  const narrow = window.matchMedia("(max-width:820px)").matches;
  const touch  = window.matchMedia("(pointer:coarse)").matches;
  isMobile = narrow || (touch && window.innerWidth < 1024);
  document.body.classList.toggle("mobile", isMobile);
}
detectView();
addEventListener("resize", detectView);

/* ── 별가루 ── */
(function(){
  const d = el("dust");
  for (let i = 0; i < 30; i++){
    const s = document.createElement("span");
    s.style.left = Math.random()*100 + "%";
    s.style.top  = Math.random()*100 + "%";
    s.style.animationDelay = (Math.random()*4) + "s";
    d.appendChild(s);
  }
})();

/* ── 상태 ── */
let total       = 0;
let pool        = [];
let queue       = [];
let cycle       = 0;
let fails       = 0;
let resetKey    = "";          // 이 키 이하의 메시지는 화면에서 제외합니다
let hidden      = {};          // 개별 숨김 처리된 메시지
let revision    = 0;           // 관리자 변경 신호
let initialized = false;
let syncPromise = null;
let visibleSig  = "";          // 현재 표시 대상 키 전체의 서명
let knownKeys   = new Set();
const lanes     = [];

function lamp(ok, text){
  el("led").classList.toggle("off", !ok);
  el("ledText").textContent = text;
}

/* ── 캐릭터 전환 ── */
const MOODS = [
  {id:"mSad",   label:"아직 마음이 무거워요",   sub:"응원이 더 필요해요"},
  {id:"mSoso",  label:"조금씩 웃기 시작했어요", sub:"응원이 닿고 있어요"},
  {id:"mHappy", label:"환하게 웃고 있어요",     sub:"고마워요, 함께해줘서"}
];
let mood = -1;
function setMood(pct){
  const next = pct <= 20 ? 0 : (pct <= 80 ? 1 : 2);
  if (next === mood) return;
  mood = next;
  MOODS.forEach((m, i) => el(m.id).classList.toggle("on", i === next));
  el("mascotLabel").textContent = MOODS[next].label;
  el("mascotSub").textContent   = MOODS[next].sub;
}

/* ── 목표 달성률 ── */
function paintGoal(){
  const pct = total / GOAL * 100;
  const barPct = Math.min(100, pct);
  const pctText = pct.toFixed(pct < 10 && pct % 1 ? 1 : 0);
  el("fill").style.width = barPct + "%";
  el("pct").textContent  = pctText + "%";   // 목표 초과 시에도 110%, 120%처럼 실제 수치 표시
  el("cur").textContent   = nf(total);
  el("count").textContent = nf(total);
  el("track").classList.toggle("done", pct >= 100);
  setMood(pct);
}

/* 표시 대상인지 판정 */
const visible = k => k > resetKey && !hidden[k];

async function fetchJSON(url){
  const res = await fetch(url, {cache:"no-store"});
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function removeNoLongerVisible(nextKeys){
  queue = queue.filter(m => nextKeys.has(m.k));
  el("field").querySelectorAll(".msg[data-key]").forEach(node => {
    if (!nextKeys.has(node.dataset.key)) node.remove();
  });
}

/*
   매 주기마다 ctrl + 전체 키를 다시 비교합니다.
   따라서 POST 추가뿐 아니라 DELETE, 숨김, 복구, 전체 리셋도 같은 방식으로 감지합니다.
   실제 메시지 본문은 키 구성이 바뀐 경우에만 다시 받아 네트워크 사용량을 줄입니다.
*/
async function syncState(){
  const [ctrlData, keyData] = await Promise.all([
    fetchJSON(CTRL),
    fetchJSON(`${MSGS}?shallow=true`)
  ]);

  const c = ctrlData || {};
  const nextReset    = c.resetKey || "";
  const nextHidden   = c.hidden || {};
  const nextRevision = Number(c.revision || 0);

  resetKey = nextReset;
  hidden   = nextHidden;

  const allKeys = keyData ? Object.keys(keyData).sort() : [];
  const visibleKeys = allKeys.filter(visible);
  const nextSig = visibleKeys.join("|");
  const nextKeys = new Set(visibleKeys);
  const keysChanged = nextSig !== visibleSig;
  const revisionChanged = nextRevision !== revision;

  total = visibleKeys.length;
  paintGoal();

  if (!initialized || keysChanged || revisionChanged){
    const latestData = await fetchJSON(`${MSGS}?orderBy="$key"&limitToLast=${CONFIG.POOL * 3}`) || {};
    const nextPool = Object.entries(latestData)
      .filter(([k]) => nextKeys.has(k))
      .sort((a,b) => a[0] < b[0] ? -1 : 1)
      .slice(-CONFIG.POOL)
      .map(([k,v]) => ({k, text:(v && v.text) || "", name:(v && v.name) || ""}));

    removeNoLongerVisible(nextKeys);

    if (!initialized){
      queue.push(...nextPool.slice(-3));
    }else{
      const fresh = nextPool
        .filter(m => !knownKeys.has(m.k))
        .map(m => ({...m, fresh:true}));
      queue.push(...fresh);
    }

    pool = nextPool;
    cycle = 0;
    el("waiting").style.display = pool.length ? "none" : "flex";
  }

  visibleSig = nextSig;
  revision   = nextRevision;
  knownKeys  = nextKeys;
  initialized = true;
}

function requestSync(){
  if (!syncPromise){
    syncPromise = syncState().finally(() => { syncPromise = null; });
  }
  return syncPromise;
}

/* 같은 브라우저의 관리자 탭 신호와 화면 복귀 시에는 즉시 다시 확인합니다. */
addEventListener("storage", e => {
  if (e.key === `blueele:room:${ROOM}`) requestSync().catch(() => {});
});
addEventListener("focus", () => requestSync().catch(() => {}));
addEventListener("online", () => requestSync().catch(() => {}));

/* ── 메시지를 아래에서 위로 띄우기 ── */
function float(m){
  const laneCount = isMobile ? 2 : 3;
  while (lanes.length < laneCount) lanes.push(0);
  lanes.length = laneCount;

  let idx = 0;
  for (let i = 1; i < laneCount; i++) if (lanes[i] < lanes[idx]) idx = i;
  lanes[idx] = performance.now() + (isMobile ? 3400 : 2600);

  const gutter = isMobile ? 5 : 4;
  const laneW  = (100 - gutter*(laneCount+1)) / laneCount;
  const jitter = (Math.random()-0.5) * (isMobile ? 2 : 3);

  const node = document.createElement("article");
  node.className = "msg" + (m.fresh ? " fresh" : "");
  node.dataset.key = m.k;
  node.style.setProperty("--x", (gutter + idx*(laneW+gutter) + jitter) + "%");
  node.style.setProperty("--w", laneW + "%");
  node.style.setProperty("--dur", ((isMobile ? 13 : 17) + Math.random()*3) + "s");

  const len = (m.text || "").length;
  const fs = isMobile
    ? (len < 16 ? "clamp(26px,7.4vw,38px)" : len < 50 ? "clamp(20px,5.4vw,29px)" : "clamp(16px,4.2vw,23px)")
    : (len < 16 ? "clamp(36px,3.4vw,62px)" : len < 50 ? "clamp(28px,2.4vw,44px)" : "clamp(21px,1.7vw,31px)");
  node.style.setProperty("--fs", fs);

  const t = document.createElement("div");
  t.className = "t";
  t.textContent = m.text;
  node.appendChild(t);

  if (m.name){
    const n = document.createElement("div");
    n.className = "n";
    n.textContent = "— " + m.name;
    node.appendChild(n);
  }

  el("field").appendChild(node);
  node.addEventListener("animationend", () => node.remove());
  setTimeout(() => node.remove(), 25000);
}

/* ── 새 메시지 우선, 없으면 순환 ── */
function tick(){
  if (queue.length){
    float(queue.shift());
  }else if (pool.length){
    float(pool[cycle++ % pool.length]);
  }
  const gap = queue.length > 2 ? 900 : (isMobile ? 2600 : 2100);
  setTimeout(tick, gap + Math.random()*600);
}

/* ── 폴링 루프 ── */
async function loop(){
  try{
    await requestSync();
    fails = 0;
    lamp(true, "실시간");
  }catch(e){
    fails++;
    lamp(false, fails > 2 ? "연결 끊김" : "재시도 중");
  }
  setTimeout(loop, CONFIG.POLL_MS);
}

paintGoal();
loop();
setTimeout(tick, 900);
</script>
